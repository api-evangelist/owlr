name: OWLR
description: >-
  OWLR (OWLR Technologies) is a London- and Fort Lauderdale-based consumer IoT
  company that builds universal remote-monitoring apps for home IP cameras,
  letting users view and manage cameras from many brands through a single mobile
  application. Its products include the OWLR Multi-Brand Viewer and brand-specific
  viewers for Foscam and D-Link, plus motion-alert notifications. OWLR emphasizes a
  privacy-first design in which camera credentials stay on the user's phone and
  nothing is stored on OWLR's servers. The company reports over two million users
  and was backed by 500 Global. OWLR is a consumer mobile product and does not
  publish a public developer API, SDK, or developer portal.
